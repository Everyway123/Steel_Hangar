# Публікація гри на GitHub Pages. Збирати нічого не треба — гра це статика.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/first-game-tyh4hr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # вмикає Pages через API прямо з воркфлоу — інакше перший запуск
          # падає з "Get Pages site failed", доки хтось не клацне в налаштуваннях
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
