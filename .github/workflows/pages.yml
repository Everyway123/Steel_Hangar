# Публікація гри на GitHub Pages. Збирати нічого не треба — гра це статика.
name: Deploy to GitHub Pages

# Pages увімкнено в налаштуваннях (Settings → Pages → Source → GitHub Actions),
# тож деплой іде на кожен пуш у гілку гри плюс за потреби вручну.
on:
  push:
    branches: [main, master, claude/first-game-tyh4hr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages уже увімкнено вручну, тож enablement тут не потрібен:
      # саме він падав із "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
