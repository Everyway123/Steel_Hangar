# Публікація гри на GitHub Pages. Збирати нічого не треба — гра це статика.
name: Deploy to GitHub Pages

# ЛИШЕ РУЧНИЙ ЗАПУСК, доки Pages не увімкнено в налаштуваннях репозиторію.
# Автозапуск на кожен пуш давав по листу про падіння за кожен коміт:
# actions/configure-pages не може створити сайт, бо токен воркфлоу
# обмежений налаштуваннями репо. Коли Pages буде увімкнено
# (Settings → Pages → Source → GitHub Actions), поверни блок push:
#   push:
#     branches: [main, master, claude/first-game-tyh4hr]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # вмикає Pages через API прямо з воркфлоу — інакше перший запуск
          # падає з "Get Pages site failed", доки хтось не клацне в налаштуваннях
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
